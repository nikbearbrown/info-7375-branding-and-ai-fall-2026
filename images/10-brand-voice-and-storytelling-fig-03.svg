  <text x="32" y="768" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Story shape is not a formula — it is the natural container for what the archetype already believes.</text>
  <text x="32" y="784" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="11" fill="#545454">Borrowing a shape from the wrong archetype activates misfire pathways even when execution is flawless.</text>
</svg>
