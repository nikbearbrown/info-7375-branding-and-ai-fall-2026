  <rect x="32" y="226" width="636" height="52" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40"  y="248" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">Social —</text>
  <text x="40"  y="262" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">labor</text>
  <text x="186" y="255" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">"fair-wage supply chain"</text>
  <text x="360" y="248" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">supplier code with</text>
  <text x="360" y="262" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">enforcement records</text>
  <text x="556" y="255" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">social auditor</text>

  <!-- social diversity -->
  <rect x="32" y="278" width="636" height="52" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40"  y="300" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">Social —</text>
  <text x="40"  y="314" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">diversity</text>
  <text x="186" y="307" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">"diverse workforce"</text>
  <text x="360" y="300" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">workforce data from an</text>
  <text x="360" y="314" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">audited HR report</text>
  <text x="556" y="307" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">HR audit</text>

  <!-- ai bias -->
  <rect x="32" y="330" width="636" height="52" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40"  y="352" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">AI ethics —</text>
  <text x="40"  y="366" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">bias</text>
  <text x="186" y="359" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">"bias-audited model"</text>
  <text x="360" y="352" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">published audit: traits</text>
  <text x="360" y="366" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">tested, set, results</text>
  <text x="556" y="359" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">third-party assessor</text>

  <!-- ai safety -->
  <rect x="32" y="382" width="636" height="52" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40"  y="404" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">AI ethics —</text>
  <text x="40"  y="418" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">safety</text>
  <text x="186" y="411" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">"human-in-the-loop"</text>
  <text x="360" y="404" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">architecture doc: where</text>
  <text x="360" y="418" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">the human sits, what authority</text>
  <text x="556" y="411" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">design + red-team</text>

  <text x="32" y="452" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#545454">"Cannot substantiate" usually means: the claim is a feeling or an aspiration with no measurement, document, or audit behind it.</text>
