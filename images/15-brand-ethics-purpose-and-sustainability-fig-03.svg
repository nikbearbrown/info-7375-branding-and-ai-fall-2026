  <!-- 6 rows, 52px each from y=122 -->
  <!-- env carbon -->
  <rect x="32" y="122" width="636" height="52" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="40"  y="144" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">Environmental —</text>
  <text x="40"  y="158" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#121212">carbon</text>
  <text x="186" y="151" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">"40% lower emissions"</text>
  <text x="360" y="144" font-family="'Inter',-apple-system,'Helvetica Neue',sans-serif" font-size="10" fill="#121212">figures from a recognized</text>
