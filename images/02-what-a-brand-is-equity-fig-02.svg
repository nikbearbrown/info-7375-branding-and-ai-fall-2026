  <title id="fig-title-02-02">Keller's CBBE pyramid</title>
  <desc>Four-level customer-based brand equity pyramid from salience at the base to resonance at the apex, annotating where purchased awareness stalls and where compound equity accumulates.</desc>
  <rect x="0" y="0" width="720" height="440" fill="#FFFFFF"/>
  <text x="32" y="38" font-family="'EB Garamond','Garamond',Georgia,serif" font-size="14" fill="#121212">How the asset is built: from salience to resonance</text>

